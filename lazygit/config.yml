# See options here = https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
gui:
  screenMode: "half" # requires lazygit 0.37.0
  showRandomTip: false
  mainPanelSplitMode: "horizontal"
  expandFocusedSidePanel: true
  showFileTree: true
  border: "rounded"
  theme:
    # Border color of focused window
    activeBorderColor:
      - "#a6e3a1" # green
      - "bold"

    # Border color of non-focused windows
    inactiveBorderColor:
      - "#6c7086" # overlay0

    # Border color of focused window when searching in that window
    searchingActiveBorderColor:
      - "#94e2d5" # teal (cyan)
      - "bold"

    # Color of keybindings help text in the bottom line
    optionsTextColor:
      - "#89b4fa" # blue

    # Background color of selected line
    selectedLineBgColor:
      - "#45475a" # surface1

    # Background color of selected line when view doesn't have focus
    inactiveViewSelectedLineBgColor:
      - "bold"

    # Foreground color of copied commit
    cherryPickedCommitFgColor:
      - "#89b4fa" # blue

    # Background color of copied commit
    cherryPickedCommitBgColor:
      - "#94e2d5" # teal (cyan)

    # Foreground color of marked base commit (for rebase)
    markedBaseCommitFgColor:
      - "#89b4fa" # blue

    # Background color of marked base commit (for rebase)
    markedBaseCommitBgColor:
      - "#f9e2af" # yellow

    # Color for file with unstaged changes
    unstagedChangesColor:
      - "#f38ba8" # red

    # Default text color
    defaultFgColor:
      - "#cdd6f4" # text
  nerdFontsVersion: "3"
git:
  autoFetch: false
  fetchAll: false # only fetch current branch
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --syntax-theme base16-256
  commit:
    autoWrapCommitMessage: false
os:
  editPreset: "nvim-remote"
notARepository: "quit"
quitOnTopLevelReturn: true
